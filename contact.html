<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Eliot Abramo</title>
<meta name="description" content="Get in touch with Eliot Abramo — embedded systems engineer, Lausanne.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111111'/><rect x='7' y='7' width='18' height='18' fill='%23C0331B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<main>
  <section class="hero wrap" style="padding-bottom:2rem">
    <h1>Contact</h1>
    <p class="standfirst">
      Happy to talk about specs, constraints and trade-offs.
      <span class="muted">Lausanne, Switzerland.</span>
    </p>
  </section>

  <div class="wrap">
    <section class="block rule-top">
      <h2>Direct</h2>
      <div class="body">
        <div class="link-row">
          <a class="link" href="mailto:eliot.abramo@epfl.ch">eliot.abramo@epfl.ch &rarr;</a>
          <a class="link" href="https://www.linkedin.com/in/eliot-abramo-757592189" target="_blank" rel="noopener">LinkedIn &rarr;</a>
          <a class="link" href="https://github.com/Eliot-Abramo" target="_blank" rel="noopener">GitHub &rarr;</a>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Or write</h2>
      <div class="body">
        <form class="form" action="https://formspree.io/f/xldlrzdk" method="POST">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" required>

          <label for="email">Email</label>
          <input id="email" type="email" name="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>

          <button class="link" type="submit">Send &rarr;</button>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="projects.js"></script>
<script src="site.js"></script>
</body>
</html>
